name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile primary modules
        run: |
          python -m py_compile app.py train.py evaluate.py src/waste_detector.py
          python -m py_compile ml_basics/01_classification.py
          python -m py_compile ml_basics/02_regression.py
          python -m py_compile ml_basics/03_clustering.py
          python -m py_compile ml_basics/04_anomaly_detection.py

      - name: Run unit tests
        run: pytest -q

      - name: Run ML smoke tests
        run: |
          python ml_basics/01_classification.py
          python ml_basics/02_regression.py
          python ml_basics/03_clustering.py
          python ml_basics/04_anomaly_detection.py
